# Blueprint do Render. No painel: New + > Blueprint > conecta este repositório.
# O Render lê este arquivo e cria o serviço web. O banco é o Neon (Postgres
# externo), então DATABASE_URL entra como secret manual (sync: false).
#
# Depois de criar, preencher no painel (aba Environment) as variáveis marcadas
# com sync: false — ver DEPLOY.md.

services:
  - type: web
    name: gestor-servicos
    runtime: python
    plan: free            # troque para "starter" p/ evitar cold start e poder anexar disco
    region: virginia      # mesma região do banco Neon (aws-us-east-1)
    branch: main
    buildCommand: "bash render-build.sh"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: NODE_VERSION
        value: "22.12.0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      # --- preencher manualmente no painel ---
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      # Opcional: rastreamento de erros no Sentry (deixe em branco p/ desligar).
      - key: SENTRY_DSN
        sync: false
      # Armazenamento das fotos/assinaturas no Cloudflare R2 (ver DEPLOY.md).
      # Sem R2_BUCKET, usa o disco do serviço (efêmero no plano free).
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

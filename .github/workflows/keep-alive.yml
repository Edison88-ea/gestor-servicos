name: keep-alive

# Mantém o serviço do Render (plano free) acordado durante o horário de uso.
# O Render hiberna após ~15 min sem tráfego e a volta demora ~50 s; este ping
# a cada ~10 min evita isso no expediente. Fora dessa janela o serviço
# hiberna normalmente (economiza as horas do plano free).
#
# Cron em UTC. 09-23 UTC = 06h-20h no horário de Brasília (UTC-3), seg-sáb.
# O agendador do GitHub Actions costuma atrasar alguns minutos, por isso o
# job faz 2 pings espaçados.

on:
  schedule:
    - cron: "*/10 9-23 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthz
        run: |
          url="https://gestor-servicos.onrender.com/healthz/"
          for i in 1 2; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 --retry 2 --retry-delay 5 "$url" || echo "000")
            echo "ping $i -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::warning::keep-alive: healthz respondeu $code (esperado 200)"
            fi
            [ "$i" = "1" ] && sleep 90
          done
